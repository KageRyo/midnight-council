name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make test-race
      - run: make js-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - run: make mod-verify
      - run: make vuln
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: midnight-council:ci
      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: midnight-council:ci
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          scanners: vuln
          severity: HIGH,CRITICAL

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: output/playwright/test-results
          if-no-files-found: ignore
