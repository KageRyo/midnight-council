<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Midnight Council server architecture</title>
  <desc id="description">A browser connects through the WebSocket handler, validation and admission controls, and the room hub to a serialized room actor and game state.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0a1021"/>
      <stop offset="1" stop-color="#17102b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 30px system-ui, sans-serif; }
      .subtitle { fill: #a5b4fc; font: 500 16px system-ui, sans-serif; }
      .box { fill: #14203a; stroke: #5eead4; stroke-width: 2; }
      .box-alt { fill: #221942; stroke: #c4b5fd; stroke-width: 2; }
      .box-title { fill: #f8fafc; font: 700 20px system-ui, sans-serif; }
      .box-copy { fill: #cbd5e1; font: 400 15px system-ui, sans-serif; }
      .arrow { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { fill: #94a3b8; font: 400 14px system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="600" fill="url(#background)" rx="24"/>
  <text x="64" y="70" class="title">Midnight Council · real-time game flow</text>
  <text x="64" y="102" class="subtitle">Authoritative server state with personalized public/private projections</text>

  <g transform="translate(70 190)">
    <rect class="box" width="200" height="140" rx="16"/>
    <text x="24" y="45" class="box-title">Browser client</text>
    <text x="24" y="78" class="box-copy">Embedded UI</text>
    <text x="24" y="104" class="box-copy">Public + private render</text>
  </g>
  <path class="arrow" d="M 280 260 H 385"/>
  <text x="302" y="240" class="note">HTTP / WebSocket</text>

  <g transform="translate(395 150)">
    <rect class="box" width="245" height="220" rx="16"/>
    <text x="24" y="42" class="box-title">WebSocket edge</text>
    <text x="24" y="76" class="box-copy">Origin allowlist</text>
    <text x="24" y="104" class="box-copy">ID / name validation</text>
    <text x="24" y="132" class="box-copy">IP admission limits</text>
    <text x="24" y="160" class="box-copy">Event token buckets</text>
    <text x="24" y="188" class="box-copy">Chat policy hook</text>
  </g>
  <path class="arrow" d="M 650 260 H 755"/>
  <text x="673" y="240" class="note">validated events</text>

  <g transform="translate(765 150)">
    <rect class="box-alt" width="365" height="220" rx="16"/>
    <text x="24" y="42" class="box-title">Room authority</text>
    <text x="24" y="76" class="box-copy">Hub: room and spectator caps</text>
    <text x="24" y="104" class="box-copy">Actor: serial commands and timers</text>
    <text x="24" y="132" class="box-copy">State: roles, rules, win checks</text>
    <text x="24" y="160" class="box-copy">Snapshots: public + per-seat private view</text>
    <text x="24" y="188" class="box-copy">Reconnect and sequence deduplication</text>
  </g>
  <path class="arrow" d="M 945 380 V 470 H 280 V 350"/>
  <text x="520" y="456" class="note">personalized state, acknowledgements, chat, and game events</text>
  <text x="64" y="555" class="note">Single-process prototype · horizontal routing and durable account data are deliberately outside the current scope.</text>
</svg>
