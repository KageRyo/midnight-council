services:
  server:
    build:
      context: .
    environment:
      ADDR: ":8080"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ROOM_IDLE_TIMEOUT: ${ROOM_IDLE_TIMEOUT:-30m}
      NIGHT_DURATION: ${NIGHT_DURATION:-1m30s}
      DAY_DISCUSSION_DURATION: ${DAY_DISCUSSION_DURATION:-5m}
      DAY_VOTING_DURATION: ${DAY_VOTING_DURATION:-1m}
      LAST_WORDS_DURATION: ${LAST_WORDS_DURATION:-30s}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_ROOMS: ${MAX_ROOMS:-1000}
      MAX_SPECTATORS_PER_ROOM: ${MAX_SPECTATORS_PER_ROOM:-24}
      WS_CONNECTIONS_PER_SECOND: ${WS_CONNECTIONS_PER_SECOND:-2}
      WS_CONNECTION_BURST: ${WS_CONNECTION_BURST:-10}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-20}
      WS_ROOM_CREATIONS_PER_SECOND: ${WS_ROOM_CREATIONS_PER_SECOND:-0.2}
      WS_ROOM_CREATION_BURST: ${WS_ROOM_CREATION_BURST:-5}
      WS_CHAT_EVENTS_PER_SECOND: ${WS_CHAT_EVENTS_PER_SECOND:-1}
      WS_CHAT_BURST: ${WS_CHAT_BURST:-5}
      WS_GAME_EVENTS_PER_SECOND: ${WS_GAME_EVENTS_PER_SECOND:-5}
      WS_GAME_BURST: ${WS_GAME_BURST:-10}
    ports:
      - "${HOST_PORT:-8080}:8080"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
